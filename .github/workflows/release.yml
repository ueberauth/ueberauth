name: Hexpm Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      path:
        description: Package directory to publish ("." for ueberauth itself)
        type: string
        required: true
    secrets:
      HEX_API_KEY:
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      # Strategies depend on the published ueberauth instead of the in-repo path.
      HEX_PUBLISH: "1"
    steps:
    - uses: actions/checkout@v6

    # Manually published releases are mapped to a package by their tag:
    # `vX.Y.Z` is ueberauth, `ueberauth_<name>-vX.Y.Z` is strategies/ueberauth_<name>.
    - name: Resolve Package Path
      id: package
      env:
        INPUT_PATH: ${{ inputs.path }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        if [ -n "$INPUT_PATH" ]; then
          path="$INPUT_PATH"
        elif [[ "$TAG" =~ ^v[0-9] ]]; then
          path="."
        else
          path="strategies/${TAG%-v*}"
        fi
        test -f "$path/mix.exs" || { echo "No mix.exs in $path"; exit 1; }
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        version-file: .tool-versions
        version-type: strict

    - name: Install dependencies
      working-directory: ${{ steps.package.outputs.path }}
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Run Hex Publish
      working-directory: ${{ steps.package.outputs.path }}
      run: mix hex.publish --yes
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
