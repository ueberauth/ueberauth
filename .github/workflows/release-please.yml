name: Release Please

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases created with GITHUB_TOKEN do not trigger the `release` event,
  # so publish each released package to Hex directly.
  publish:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != ''
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    uses: ./.github/workflows/release.yml
    with:
      path: ${{ matrix.path }}
    secrets: inherit
