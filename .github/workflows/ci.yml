name: Continuous Integration

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'main'
jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The three most recent Elixir minors, each paired with the OTP
      # versions hex.pm publishes builds for on ubuntu-latest (26.04).
      matrix:
        include:
          - { elixir: "1.18", otp: "26" }
          - { elixir: "1.18", otp: "27" }
          - { elixir: "1.18", otp: "28" }
          - { elixir: "1.19", otp: "26" }
          - { elixir: "1.19", otp: "27" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.20", otp: "27" }
          - { elixir: "1.20", otp: "28" }
          - { elixir: "1.20", otp: "29" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Run Tests
        run: mix test

  Linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Run Formatter
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo

      - name: Check for Retired or Vulnerable Dependencies
        run: mix hex.audit

      - name: Compile Without Warnings
        run: MIX_ENV=test mix compile --warnings-as-errors --force

      - name: Run Tests with Coverage
        run: mix coveralls

  Dialyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Restore PLT Cache
        id: plt_cache
        uses: actions/cache/restore@v5
        with:
          path: _build/dev/*.plt*
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Build PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT Cache
        if: steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/dev/*.plt*
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}

      - name: Run Dialyzer
        run: mix dialyzer --format github

  Strategies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - ueberauth_apple
          - ueberauth_facebook
          - ueberauth_github
          - ueberauth_google
          - ueberauth_twitter
    defaults:
      run:
        working-directory: strategies/${{ matrix.strategy }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Run Formatter
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo

      - name: Compile Without Warnings
        run: MIX_ENV=test mix compile --warnings-as-errors --force

      # Tests run against ueberauth from this checkout, so core changes
      # that break a strategy fail here.
      - name: Run Tests
        run: mix test

      - name: Build Hex Package
        env:
          HEX_PUBLISH: "1"
        run: |
          mix deps.get
          mix hex.build
