name: Continuous Integration

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'master'
jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
       matrix:
         elixir: ["1.15", "1.16", "1.17", "1.18", "1.19", "1.20"]
         otp: ["24", "25", "26", "27", "28"]
         exclude:
           - elixir: "1.15"
             otp: "27"
           - elixir: "1.15"
             otp: "28"
           - elixir: "1.16"
             otp: "27"
           - elixir: "1.16"
             otp: "28"
           - elixir: "1.17"
             otp: "24"
           - elixir: "1.17"
             otp: "28"
           - elixir: "1.18"
             otp: "24"
           - elixir: "1.18"
             otp: "28"
           - elixir: "1.19"
             otp: "24"
           - elixir: "1.19"
             otp: "25"
           - elixir: "1.20"
             otp: "24"
           - elixir: "1.20"
             otp: "25"
           - elixir: "1.20"
             otp: "26"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Run Tests
        run: mix test

  Linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Run Formatter
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo

      - name: Check for Retired or Vulnerable Dependencies
        run: mix hex.audit

      - name: Compile Without Warnings
        run: MIX_ENV=test mix compile --warnings-as-errors --force

      - name: Run Tests with Coverage
        run: mix coveralls

  Dialyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Restore PLT Cache
        id: plt_cache
        uses: actions/cache/restore@v5
        with:
          path: _build/dev/*.plt*
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Build PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT Cache
        if: steps.plt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: _build/dev/*.plt*
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}

      - name: Run Dialyzer
        run: mix dialyzer --format github
